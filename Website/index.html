<!DOCTYPE html>
<!-- Edit log:
     v1 (2026-11-14) first version: radio chassis, scope, LED meter, dial panel, controls
     v2 (2026-11-14) Auto-tune button removed; Reset now auto-tunes
     v3 (2026-11-14) Tolerance locked to Loose; selector commented out
     v4 (2026-11-14) Waves selector and Cross-talk option commented out; single wave, no cross-talk
     v5 (2026-11-14) Load datafile.txt button and file input; New signal commented out; message line added
     v6 (2026-11-14) Turns counter removed from the status bar, time only
     v7 (2026-11-14) Blank grille window now shows picture.png, pixelated until the signal locks
     v8 (2026-11-14) Difficulty (E..A) shown in the status bar; tolerance selector block removed
     v9 (2026-11-14) Theme hooks: ids on title, meter label, lamp text and legend; theme set from datafile.txt
     v10 (2026-11-14) Themes load from theme.NAME.css files (added by radio.js when datafile.txt names one)
     v11 (2026-11-14) radio.js always looks for one generic theme.css; theme= line no longer needed
     v12 (2026-11-14) Six empty background layers (.bglayers) inside the scope frame; hidden unless theme.css shows them
     v13 (2026-11-14) Theme switch button (hidden unless theme.css exists); help text mentions the angle dial
     v14 (2026-11-14) No markup changes; angle dial is now a full-turn dial (see radio.js)
     v15 (2026-11-14) No markup changes; datafile can be encoded (see radio.js and tools/encode_datafile.py)
     v16 (2026-11-14) No markup changes; picture can be encoded as picture.js (see radio.js)
     v17 (2026-11-15) Save result button (hidden until the puzzle is locked); see radio.js
     v18 (2026-11-15) No markup changes; result file simplified (see radio.js)
     v19 (2026-11-15) No markup changes; Save result no longer asks for a name (see radio.js)
     v20 (2026-11-15) No markup changes; picture.js problems are reported (see radio.js)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Tuner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="radio">
    <header id="ttl" class="titlebar">Signal Tuner</header>

    <section class="top">
      <div id="picwrap" class="grille">
        <canvas id="pic" role="img" aria-label="Picture that comes into focus as the signal locks"></canvas>
      </div>
      <div class="scopewrap">
        <div class="bglayers" aria-hidden="true"><i class="bg1"></i><i class="bg2"></i><i class="bg3"></i><i class="bg4"></i><i class="bg5"></i><i class="bg6"></i></div>
        <canvas id="scope" role="img" aria-label="Oscilloscope showing your signal and the station signal"></canvas>
        <div id="banner" role="status" hidden></div>
      </div>
    </section>

    <section class="meter">
      <span id="mlabel" class="mlabel">SIGNAL</span>
      <div id="leds" class="leds" aria-hidden="true"></div>
      <span id="pct" class="pct">0%</span>
      <span id="lamp" class="lamp"><i></i><span id="lampText">LOCK</span></span>
      <span class="legend">
        <svg width="34" height="10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" stroke="currentColor" stroke-width="3"/></svg> <span id="lgMine">yours</span>
        <svg width="34" height="10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" stroke="currentColor" stroke-width="3" stroke-dasharray="6 4"/></svg> <span id="lgTarget">station</span>
      </span>
    </section>

    <section id="dials" class="dials"></section>

    <section class="controls">
      <div class="row">
        <button id="btnLoad" type="button">Load datafile.txt</button>
        <input id="fileIn" type="file" accept=".txt,text/plain" hidden>
        <!-- New signal disabled, the target now comes from datafile.txt
        <button id="btnNew" type="button">New signal</button>
        -->
        <button id="btnReset" type="button" title="Auto-tunes to the station">Reset</button>
        <button id="btnSave" type="button" title="Save a result file to hand in" hidden>Save result</button>
        <button id="btnTheme" type="button" hidden>Use CDE theme</button>
        <!-- Waves selector disabled, single wave only (see st.K in radio.js)
        <label>Waves
          <select id="selWaves">
            <option value="1">1 (3 dials)</option>
            <option value="2">2 (6 dials)</option>
            <option value="3">3 (9 dials)</option>
          </select>
        </label>
        -->
      </div>
      <div class="row">
        <!-- Cross-talk disabled (see st.coupled in radio.js)
        <label><input id="chkCouple" type="checkbox"> Cross-talk</label>
        -->
        <label><input id="chkEasy" type="checkbox"> Easy numbers</label>
        <label><input id="chkSound" type="checkbox"> Sound</label>
        <label><input id="chkHear" type="checkbox"> Hear station</label>
      </div>
      <p class="help">
        Drag around a dial to turn it, hold Shift for fine turns. Mouse wheel or arrow keys also work.
        Load datafile.txt first. Then match the solid trace to the dashed one, tilt included, and hold it.
      </p>
      <p id="msg" class="msg" role="status"></p>
    </section>

    <footer class="status">
      <span>Time <b id="time">0:00.0</b></span>
      <!-- Turns display disabled, time only
      <span>Turns <b id="turns">0</b></span>
      -->
      <span>Difficulty <b id="grade">-</b></span>
      <span>State <b id="state">TUNING</b></span>
    </footer>
  </main>
  <script src="radio.js"></script>
</body>
</html>
